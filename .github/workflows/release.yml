name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/package-release.py --check-tag "$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux, arch: x86_64}
          - {runner: ubuntu-22.04-arm, platform: linux, arch: arm64}
          - {runner: macos-15-intel, platform: macos, arch: x86_64}
          - {runner: macos-15, platform: macos, arch: arm64}
          - {runner: windows-2022, platform: windows, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python tests/test_release.py
      - name: Build and test Linux / macOS
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          options=()
          if [ '${{ matrix.platform }}' = macos ]; then
            options+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          fi
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release "${options[@]}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Build and test Windows
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          printf 'MINGW_BIN=%s\n' "$(cygpath -w "$MINGW_PREFIX/bin")" >> "$GITHUB_ENV"
      - name: Package Linux / macOS and test installation
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          python scripts/package-release.py --build-dir build --output-dir dist --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
          python tests/test_install.py dist/*.tar.gz
      - name: Package Windows and test installation
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python scripts/package-release.py --build-dir build --output-dir dist --platform windows --arch x86_64 --runtime-dir "$env:MINGW_BIN"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          ./tests/test_install.ps1 -Archive dist/blacksquelch-windows-x86_64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify all packages and collect installers
        run: python scripts/package-release.py --prepare-assets dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.sha256 dist/install-release.sh dist/install-release.ps1 \
            --verify-tag --generate-notes --title "BlackSquelch $RELEASE_TAG"
